name: online course registration system

on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Run backend tests ──────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install --prefix backend

      - name: Run backend tests
        run: npm test --prefix backend
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

  # ── Job 2: Build frontend ─────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    needs: test           # only build if tests pass
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build React app
        run: npm run build --prefix frontend

      # Upload the build folder so the deploy job can use it
      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: frontend/build/

  # ── Job 3: Deploy to EC2 ─────────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend   # only deploy after build succeeds
    steps:
      - uses: actions/checkout@v3

      - name: Download frontend build artifact
        uses: actions/download-artifact@v3
        with:
          name: frontend-build
          path: frontend/build/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # Copy backend files (no node_modules)
      - name: Copy backend to EC2
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/deploy_key.pem" \
            ./backend/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/backend/

      # Copy the pre-built React files
      - name: Copy frontend build to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key.pem" \
            ./frontend/build/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/frontend/build/

      # SSH in: write .env, install deps, restart backend
      - name: Install & restart on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            # Write .env from GitHub secrets (never committed to repo)
            cat > /home/ubuntu/app/backend/.env << ENVEOF
          MONGO_URI=${{ secrets.MONGO_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=5000
          ENVEOF

            # Install backend production dependencies
            cd /home/ubuntu/app/backend
            npm install --omit=dev

            # Restart or start backend with PM2
            pm2 restart mern-backend 2>/dev/null || \
              pm2 start server.js --name mern-backend

            pm2 save
            echo " Backend restarted"

            # Reload Nginx to pick up any config changes
            sudo systemctl reload nginx
            echo "Nginx reloaded"
          EOF